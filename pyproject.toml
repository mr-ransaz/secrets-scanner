[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "secrets-scanner"
version = "0.1.0"
description = "Defensive offline scanner for likely hardcoded secrets"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
authors = [{name = "MR Ransaz"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-cov==7.1.0", "ruff==0.17.1", "build==1.6.1", "PyInstaller==6.22.3"]

[project.scripts]
secretscan = "secretscan.cli:main"

[project.urls]
Repository = "https://github.com/mr-ransaz/secrets-scanner"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=secretscan --cov-branch --cov-report=term-missing --cov-fail-under=90"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
branch = true
